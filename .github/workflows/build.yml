name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build number 是 commit 數,淺 clone 會讓它永遠是 1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # 字型是產生物,不進版控。同一份 subset 腳本就會產出同一份 woff2,
      # 所以用腳本的 hash 當 cache key,省下每次 ~15 MB 的原始 ttf 下載。
      - name: cache subset fonts
        id: fontcache
        uses: actions/cache@v4
        with:
          path: assets/fonts/*.woff2
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      - name: install fonttools
        if: steps.fontcache.outputs.cache-hit != 'true'
        run: pip install --quiet fonttools brotli

      - name: subset fonts
        if: steps.fontcache.outputs.cache-hit != 'true'
        # 抓不到 Google Fonts 不該讓整個 build 失敗:擴充在沒有打包字型時
        # 會退回系統中文字型,仍然可用(見 docs/fonts.md)。
        continue-on-error: true
        run: npm run fonts

      - name: build
        run: npm run build

      - name: zip
        run: npm run zip

      - name: report
        run: |
          echo "### $(node -p "require('./dist/manifest.json').version_name")" >> "$GITHUB_STEP_SUMMARY"
          echo "### dist" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -ah dist | sort -k2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la release >> "$GITHUB_STEP_SUMMARY"

      # 未封裝載入用:下載後解壓,chrome://extensions → 載入未封裝項目
      - uses: actions/upload-artifact@v4
        with:
          name: kasanemu-unpacked
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: kasanemu-zip
          path: release/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kasanemu-zip
          path: release
      - name: attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        # tag 有兩條來路,而它們的先後順序相反:
        #   CLI  `git push origin v0.1.0` → tag 先有,release 還不存在
        #   UI   「Draft a new release」   → release 先有,tag 才被推出來
        # 只寫 create 的話,第二條路會撞「already exists」而整個 job 變紅,
        # 使用者看到的是「發了 release 但 CI 失敗,而且 zip 沒附上」。
        # 兩條都要能把 zip 掛上去。
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
          else
            # 附註標籤(annotated tag)的訊息就是我寫的發行說明,優先用它;
            # UI 建的是輕量標籤、沒有訊息,那時才退回自動產生的 commit 列表。
            gh release create "$GITHUB_REF_NAME" release/*.zip \
              --title "$GITHUB_REF_NAME" --notes-from-tag \
            || gh release create "$GITHUB_REF_NAME" release/*.zip \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # 上傳成功不等於檔案還在:如果有人開著草稿的編輯表單、在這之後才按
      # Publish,那份陳舊的表單會把 asset 洗掉(docs/deviations.md §DD)。
      # 那個覆蓋擋不住,但至少不要讓它靜悄悄 —— job 紅了才有人會去看。
      - name: verify asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=$(gh release view "$GITHUB_REF_NAME" --json assets \
                --jq '[.assets[] | select(.name | endswith(".zip"))] | length')
          echo "zip assets on $GITHUB_REF_NAME: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::release $GITHUB_REF_NAME has no zip asset —" \
                 "有人在上傳之後送出了陳舊的編輯表單?重跑這個 job 即可補回。"
            exit 1
          fi
